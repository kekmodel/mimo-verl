- name: mimo_swe_agent
  _target_: recipes.general.agent_loop.GeneralAgentLoop
  mimoagent_config_path: config/agent/general/s3k.yaml

  per_turn_max_tokens: 65536

  reward_timeout: ${oc.env:REWARD_TIMEOUT,0}

  env_setup_timeout: ${oc.env:ENV_SETUP_TIMEOUT,3600}

  fail_on_env_setup_error: ${oc.env:FAIL_ON_ENV_SETUP_ERROR,false}

  invalid_reward_for_infra: ${oc.env:INVALID_REWARD_FOR_INFRA,true}

  # Tool-execution budget (summed duration of the agent's tool calls): at the limit the
  # rollout is frozen and its final state graded, like the token budget (RESPONSE_LENGTH).
  # A hyperparameter: tune so rollout/exec_budget_hit_rate stays around 1% or below.
  # Sizing: budget + one command overshoot (bash max 300s) = half of trajectory_timeout.
  exec_budget_seconds: ${oc.env:EXEC_BUDGET_SECONDS,300}
  # Wall-clock backstop only (counts inference queueing and sandbox speed, which are not the
  # policy's); upstream value. A rollout it stops is dropped as infra; keep that near zero.
  trajectory_timeout: ${oc.env:TRAJECTORY_TIMEOUT,1200}

  env_num_cpus: ${oc.env:ENV_NUM_CPUS,0.125}
  agent_thread_pool_size: 64
