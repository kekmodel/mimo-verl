
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_megatron_trainer
  - _self_

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ???
    use_fused_kernels: true
    mtp:
      enable: false
      enable_train: false
      enable_rollout: false

  rollout:
    name: sglang
    mode: async
    prompt_length: 49152
    response_length: 212992
    max_model_len: 262144
    n: 8
    tensor_model_parallel_size: 4
    data_parallel_size: 1
    gpu_memory_utilization: 0.75
    max_num_seqs: 64
    load_format: auto
    engine_kwargs:
      sglang:
        max_mamba_cache_size: 384
        mamba_scheduler_strategy: no_buffer
        log_level: error
    multi_turn:
      enable: true
      format: qwen3_coder
    agent:
      default_agent_loop: mimo_swe_agent
      agent_loop_config_path: recipes/general/config/general_agent_loop.yaml
      num_workers: 32
    temperature: 1.0
    top_p: 0.95
    top_k: -1

  actor:
    use_dynamic_bsz: true
    ppo_mini_batch_size: 64
    ppo_max_token_len_per_gpu: 262144
    loss_agg_mode: prompt-mean
    clip_ratio: 0.2
    # Eq. (1) loss; the rollout_correction settings live under algorithm.
    policy_loss:
      loss_mode: bypass_mode
      rollout_correction: ${algorithm.rollout_correction}
    entropy_coeff: 0
    use_kl_loss: false
    calculate_entropy: false
    optim:
      lr: 2e-6
    megatron:
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      use_mbridge: true
      vanilla_mbridge: false
      use_remove_padding: true
      override_transformer_config:
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1

data:
  train_files: ???
  val_files: ???
  prompt_key: prompt
  train_batch_size: 64
  max_prompt_length: 49152
  max_response_length: 212992
  filter_overlong_prompts: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  # Report Eq. (1): L = -sum_t sg[pi/mu] * M * A * log pi, with mu the rollout engine's
  # per-token probability (not recomputed, also across partial-rollout weight updates) and
  # M = 0 outside [0.2, 5.0] (IcePop-style mask; masked tokens stay in the normalizer).
  # The report splits the bounds by advantage sign and tunes them from policy entropy, but
  # both start at [0.2, 5.0] and the tuning rule is not published, so they stay fixed here.
  rollout_correction:
    bypass_mode: true
    loss_type: reinforce
    rollout_is: token
    rollout_is_threshold: "0.2_5.0"

  invalid_reward_value: -999

  filter_groups:
    enable: true
    metric: reward
    max_inflight_gen_batches: 2

  # Group-relative length penalty, report Eq. 4, values from recipes/arvo/REFERENCE_PENALTIES.json.
  # Only successful rollouts of groups with pass rate > min_pass_rate are shaped; excess is the
  # worst of turns / input tokens (prompt + tool output) / output tokens over the group's p30.
  length_penalty:
    enable: true
    max_penalty: 0.2
    excess_threshold: 0.0
    excess_saturate: 1.0
    penalty_exponent: 1.5
    metrics: [turns, input_tokens, output_tokens]
    combine: max
    pass_threshold: 0.5
    anchor_quantile: 0.3
    min_pass_rate: 0.5

  # Invalid rows (is_infra, or the invalid_reward_value sentinel) leave the GRPO baseline, the
  # loss and the prompt-mean normalization. false reproduces upstream.
  exclude_invalid_rows: true
  # Rescale GRPO groups that lost rows (infra, dropped sessions) to the full-group factor.
  group_size_correction: true

  # Segment-level tool-call error penalty (report Eq. 5): a model turn whose tool call failed
  # gets advantage 0 in a positive rollout and x2 in a negative one; per-sign mass is
  # rebalanced over the batch. Turn spans come from the agent loop's extra_fields.
  tool_call_error_penalty:
    enable: true
    strategy: adv_signed
    penalty_value: 2.0
    mask_source: spans
  signed_min_scale: 0.5
  signed_max_scale: 2.0

trainer:
  nnodes: 4
  n_gpus_per_node: 8
  total_epochs: 5
  logger:
    - console
    - tensorboard
  val_before_train: false
  test_freq: -1
  save_freq: 1
  log_val_generations: 5
  max_actor_ckpt_to_keep: null
  resume_mode: auto
  v1:
    trainer_mode: sync
