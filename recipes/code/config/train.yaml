
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_megatron_trainer
  - _self_

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ???

  rollout:
    name: sglang
    mode: async
    nnodes: 0
    n_gpus_per_node: 8
    prompt_length: 8192
    response_length: 253952
    max_model_len: 262144
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    do_sample: true
    load_format: auto
    n: 16
    tensor_model_parallel_size: 4
    data_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 512
    log_prob_max_token_len_per_gpu: 131072
    prometheus:
      enable: true
    disable_log_stats: false
    engine_kwargs:
      sglang:
        kv_cache_dtype: fp8_e4m3
        attention_backend: flashinfer
        chunked_prefill_size: 32768
        max_prefill_tokens: 32768
        mamba_scheduler_strategy: extra_buffer
        enable_metrics_for_all_schedulers: true
        log_level: error
    calculate_log_probs: true
    enable_sleep_mode: true
    free_cache_engine: true
    log_prob_micro_batch_size_per_gpu: 1
    val_kwargs:
      n: 1
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      do_sample: false
    multi_turn:
      enable: true
      max_parallel_calls: 1
      format: qwen3_coder
    agent:
      num_workers: 4
      agent_loop_manager_class: uni_agent.framework.entry.AgentFrameworkRolloutAdapter
    custom:
      agent_framework:
        gateway_count: 1
        log_dir: ${oc.env:UNI_AGENT_LOG_DIR,/tmp/uni_agent_logs}
        mask_unfinished_episode: false
        ship_turn_index: false
        repetition_detect:
          enable: false
          ngram_size: 300
          window_size: 8300
          min_content_length: 16384
          min_repeat: 15
          zero_reward: false
        agent_runners:
          mimoagent:
            runner_fqn: recipes.code.mimoagent_runner.mimoagent_runner
            dispatch_mode: ray_task
            max_concurrent_sessions: 8
            # all: train every context of a session (sub-agents, compaction). "longest" drops the
            # other contexts' gradient terms although their actions share the session reward.
            trajectory_selection: all
            # Budgets the policy is responsible for, each graded at its limit: tokens
            # (rollout.response_length), steps, and tool-execution time
            # (runner_kwargs.exec_budget_seconds: summed duration of the pod commands the agent
            # ran). At the tool budget the rollout is frozen, the running command ends under its
            # own pod timeout, and the final state is graded. Wall clock is not a policy budget:
            # it also counts training pauses (colocated rollout stops while the trainer updates),
            # inference queueing and sandbox speed.
            # session_timeout_seconds is only a backstop for a hung runner; it counts those pauses
            # too, so keep it above the longest healthy rollout (upstream 7200s). With the
            # `wait` staleness strategy it is also the worst-case trainer stall, so do not inflate
            # it. A session it kills is dropped as infra; watch that this stays near zero.
            # agent_request_idle_timeout_seconds fires only when one tool call stalls with no model
            # request in flight (not during training pauses); it must exceed the largest tool
            # timeout (bash 600s + 5s).
            # Sizing: exec budget + one command overshoot (bash max 600s) = half the backstop,
            # leaving the other half for generation, queueing and training pauses.
            runner_kwargs:
              exec_budget_seconds: ${oc.env:EXEC_BUDGET_SECONDS,3000}
              # Harnesses the budget applies to; null = the model-backed ones whose model calls
              # the runner sees (blackbox harnesses keep their own run_timeout).
              exec_budget_agent_types: null
              # Liveness probe after a budget hit; a dead pod is dropped as infra.
              exec_budget_probe_timeout: 30
              # Ship the task text in reward_info so a GAR grader can read it (run_train.sh
              # turns it on with GAR_ENABLE).
              include_task_in_reward_info: false
            session_timeout_seconds: ${oc.env:TRAJECTORY_TIMEOUT,7200}
            agent_request_idle_timeout_seconds: ${oc.env:AGENT_REQUEST_IDLE_TIMEOUT,900}
            trajectory_timeout_by_dataset: {}

  actor:
    use_dynamic_bsz: true
    use_rollout_log_probs: true
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 131072
    use_kl_loss: false
    kl_loss_coef: 0.001
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    loss_agg_mode: prompt-mean
    # Eq. (1) loss; the rollout_correction settings live under algorithm.
    policy_loss:
      loss_mode: bypass_mode
      rollout_correction: ${algorithm.rollout_correction}
    entropy_coeff: 0
    entropy_from_logits_with_chunking: true
    entropy_from_logits_chunk_size: 16384
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1e-6
      weight_decay: 0.01
      lr_decay_style: constant
    megatron:
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      context_parallel_size: 2
      expert_model_parallel_size: 1
      use_mbridge: true
      vanilla_mbridge: false
      use_remove_padding: false
      override_transformer_config:
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1
        attention_backend: auto

  ref:
    log_prob_max_token_len_per_gpu: 131072
    megatron:
      param_offload: true
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      context_parallel_size: 2

data:
  train_files: ???
  val_files: ???
  prompt_key: prompt
  truncation: error
  max_prompt_length: 8192
  max_response_length: 253952
  train_batch_size: 32
  val_batch_size: null
  gen_batch_size: 1
  return_raw_chat: true
  trust_remote_code: false
  dataloader_num_workers: 8
  filter_overlong_prompts: false
  apply_chat_template_kwargs: {}
  custom_cls:
    path: pkg://recipes.code.dataset
    name: MimoAgentSWEDataset

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  group_advantage_by_harness: false
  use_kl_in_reward: false
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  filter_groups:
    enable: true
    metric: reward
    max_inflight_gen_batches: 2
  tool_call_error_penalty:
    enable: true
    strategy: adv_signed
    penalty_value: 2.0
    mask_source: field
  repetition_penalty:
    enable: false
    strategy: monitor
    penalty_value: 0.0
  deep_failure_mask:
    enable: false
    strategy: mask_failure
    alpha: 1.0
  signed_min_scale: 0.5
  signed_max_scale: 2.0
  # Group-relative length penalty, report Eq. 4, values from recipes/arvo/REFERENCE_PENALTIES.json.
  # Only successful rollouts of groups with pass rate > min_pass_rate are shaped; excess is the
  # worst of turns / input tokens (prompt + tool output) / output tokens over the group's p30.
  length_penalty:
    enable: true
    max_penalty: 0.2
    excess_threshold: 0.0
    excess_saturate: 1.0
    penalty_exponent: 1.5
    metrics: [turns, input_tokens, output_tokens]
    combine: max
    pass_threshold: 0.5
    anchor_quantile: 0.3
    min_pass_rate: 0.5

  # Invalid rows (extra_fields is_infra, or the invalid_reward_value sentinel) leave the GRPO
  # baseline, the loss and the prompt-mean normalization. false reproduces upstream.
  exclude_invalid_rows: true
  # Rescale GRPO groups that lost rows (infra, dropped sessions) to the full-group factor.
  group_size_correction: true
  # GAR (report 4.3.2, GAGAR arXiv 2609.32577): a grader ranks the passes of each mixed group and
  # positive advantage moves toward better passes, total preserved. Factors are the paper's
  # Flash configuration. The grader is a callable grade(groups) -> {group_id: GroupResult | None}
  # loaded from grader.path / grader.name (verl.trainer.ppo.gar documents the types).
  gar:
    enable: false
    f_runner: 0.9
    f_max: 0.85
    f_min: 0.4
    f_low: 0.2
    lambda_max: 1.5
    pass_threshold: 1.0
    # LLM API grader (verl/trainer/ppo/gar_api_grader.py). run_train.sh fills url / api / model
    # from GAR_GRADER_URL / GAR_GRADER_API / GAR_GRADER_MODEL. The key is read on the trainer
    # node from api_key_file or the env var api_key_env, never from this config.
    grader:
      path: pkg://verl.trainer.ppo.gar_api_grader
      name: APIGrader
      kwargs:
        url: ""
        api: chat  # chat (OpenAI Chat Completions) | responses (OpenAI Responses) | anthropic (Messages)
        model: ""
        api_key_env: GAR_GRADER_API_KEY
        api_key_file: null  # recommended: the trainer is a Ray actor and may not see the shell's env
        auth_header: null  # null = bearer (chat/responses) or x-api-key (anthropic); api-key for Azure
        max_output_tokens: 4096
        chat_max_tokens_field: max_completion_tokens
        timeout: 600
        max_retries: 3
        max_workers: 16
        # Grading runs inside the training step: every group not graded by then falls back.
        deadline_seconds: 1800
        max_prompt_chars: 200000
        max_failed_candidates: 4
  # Report Eq. (1): L = -sum_t sg[pi/mu] * M * A * log pi, with mu the rollout engine's
  # per-token probability (not recomputed, also across partial-rollout weight updates) and
  # M = 0 outside [0.2, 5.0] (IcePop-style mask; masked tokens stay in the normalizer).
  # The report splits the bounds by advantage sign and tunes them from policy entropy, but
  # both start at [0.2, 5.0] and the tuning rule is not published, so they stay fixed here.
  rollout_correction:
    bypass_mode: true
    loss_type: reinforce
    rollout_is: token
    rollout_is_threshold: "0.2_5.0"

reward:
  custom_reward_function:
    path: pkg://recipes.code.reward
    name: compute_score

trainer:
  nnodes: 4
  n_gpus_per_node: 8
  total_epochs: 6
  total_training_steps: 200
  project_name: opensource-code
  experiment_name: four-whitebox
  logger:
    - console
  device: cuda
  val_before_train: false
  val_only: false
  save_freq: 5
  test_freq: -1
  log_val_generations: 5
  default_local_dir: outputs/four-whitebox/ckpt
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  resume_mode: disable
  use_v1: true
  v1:
    trainer_mode: colocate_async
    colocate_async:
      num_warmup_batches: 1
    sampler:
      max_off_policy_threshold: 4
      # wait: block the next update until rollouts about to exceed the threshold finish.
      # drop would discard exactly the long rollouts (those spanning many policy versions) --
      # a length-dependent censoring of the training signal.
      max_off_policy_strategy: wait

transfer_queue:
  enable: true

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        TRANSFER_QUEUE_ENABLE: ""
